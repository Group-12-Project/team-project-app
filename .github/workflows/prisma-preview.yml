name: Prisma backend preview

on:
  push:
    branches: [backend-database]

concurrency:
  group: prisma-backend-preview
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  preview:
    if: github.ref == 'refs/heads/backend-database'
    runs-on: ubuntu-latest
    steps:
      - name: Require a feature branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$DEFAULT_BRANCH" = 'backend-database' ]; then
            echo 'Restore main as the GitHub default branch before deploying this preview.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: npm ci
      - name: Build and deploy backend preview
        id: deploy
        uses: prisma/cloud-deploy-action@v1
        with:
          working-directory: deploy
          install-command: npm ci
          build-command: npm run check:config && npm run build && npm run typecheck && npm run smoke
          # Separate Composer state from the manually created database environment.
          environment: backend-preview
      - name: Require an actual deployment
        if: steps.deploy.outputs.outcome != 'succeeded'
        run: |
          echo 'Preview was not deployed. Check the Prisma repository connection and Actions logs.'
          exit 1
